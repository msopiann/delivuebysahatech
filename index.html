<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Delivue – Coming Soon</title>
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://delivue.sahatech.id/" />
    <meta property="og:title" content="Delivue" />
    <meta property="og:description" content="Platform delivery management" />
    <meta property="og:image" content="https://delivue.sahatech.id/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Delivue" />
    <meta name="twitter:description" content="Platform delivery management" />
    <meta name="twitter:image" content="https://delivue.sahatech.id/og-image.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:ital,wght@0,400;0,500;1,400&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <canvas id="c"></canvas>
    <div class="grain"></div>

    <div class="page">

        <!-- Top -->
        <header class="topbar">
            <div class="logo">
                <div class="logo-icon">D</div>
                <span class="logo-name">Delivue</span>
            </div>
            <span class="badge">Coming Soon</span>
        </header>

        <!-- Center -->
        <main class="center">
            <div class="eyebrow">
                <span class="eyebrow-dot"></span>
                Segera Hadir di Kota Anda
            </div>

            <h1>Delivery<br><span class="accent">Via WhatsApp.</span></h1>

            <p class="sub">
                Tidak perlu install aplikasi. Harga outlet asli, tanpa markup.
            </p>

            <!-- Countdown -->
            <div class="countdown">
                <div class="cd-block">
                    <span class="cd-num" id="cd-d">00</span>
                    <span class="cd-label">Hari</span>
                </div>
                <span class="cd-sep">:</span>
                <div class="cd-block">
                    <span class="cd-num" id="cd-h">00</span>
                    <span class="cd-label">Jam</span>
                </div>
                <span class="cd-sep">:</span>
                <div class="cd-block">
                    <span class="cd-num" id="cd-m">00</span>
                    <span class="cd-label">Menit</span>
                </div>
                <span class="cd-sep">:</span>
                <div class="cd-block">
                    <span class="cd-num" id="cd-s">00</span>
                    <span class="cd-label">Detik</span>
                </div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>

</html>
